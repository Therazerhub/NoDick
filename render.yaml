services:
  - type: web
    name: nodick-bot
    env: docker
    region: oregon
    plan: free
    healthCheckPath: /
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOT_TOKEN
        value: 8206593405:AAHC77fwS8mpr1oBDOLMfLjVipzRtOYb8gg
      - key: ADMIN_ID
        value: "6001922744"
      - key: TELEGRAM_API_ID
        value: "20227614"
      - key: TELEGRAM_API_HASH
        value: b9268f7d01884a3d740ba17d0ad8754b
      - key: DB_PATH
        value: /data/nodick.db
      - key: TELEGRAM_USER_SESSION
        value: /data/nodick_user
      - key: STASHDB_API_KEY
        value: eyJhbG...R7CA
      # PostgreSQL connection string — set this for persistent storage on Render.
      # Get the Internal Database URL from your Render PostgreSQL dashboard.
      - key: DATABASE_URL
        # Internal URL — Render auto-resolves this within its network.
        # Do NOT use the external (.oregon-postgres.render.com) URL here.
        value: postgresql://nodick_user:BFPUUHl5tgqapcdv79dWMFZnNGLd6yy2@dpg-d9j6bj3eo5us73au3et0-a/nodick
    disk:
      name: nodick-data
      mountPath: /data
      sizeGB: 1
