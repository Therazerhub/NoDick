services:
  - type: web
    name: nodick-bot
    env: docker
    region: oregon
    plan: free
    healthCheckPath: /
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "6001922744"
      - key: BOT_USERNAME
        value: Moyechan_bot

      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: DB_PATH
        value: /data/nodick.db
      - key: TELEGRAM_USER_SESSION
        value: /data/nodick_user
      - key: STASHDB_API_KEY
        sync: false
      # PostgreSQL connection string — set in Render dashboard, not here (secret).
      - key: DATABASE_URL
        sync: false
    disk:
      name: nodick-data
      mountPath: /data
      sizeGB: 1
